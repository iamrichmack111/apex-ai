name: Apex AI CD

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build distribution ZIP
        run: |
          mkdir -p dist
          zip -r dist/apex-ai-${GITHUB_SHA::7}.zip . \
            -x ".git/*" \
               ".github/*" \
               "dist/*" \
               ".venv/*" \
               ".knowledge-venv/*" \
               "data/*.db*" \
               "data/generated/*" \
               "image-engine/models/*" \
               "image-engine/stable-diffusion.cpp/*" \
               "*.gguf" \
               "*.safetensors"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-ai-${{ github.sha }}
          path: dist/*.zip

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
